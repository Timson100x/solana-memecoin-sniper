[package]
name = "solana-trading-bot"
version = "0.3.0"
edition = "2021"
description = "Solana momentum trading bot: Helius + Jupiter routing, paper-first."
license = "MIT"

[lints]
[lints.rust]
unsafe_code = "forbid"
unused = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[profile.release]
opt-level = 3

[dependencies]
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rust_decimal = { version = "1.35", features = ["serde"] }
rust_decimal_macros = "1.35"
clap = { version = "4.5", features = ["derive", "env"] }

solana-sdk = { version = "2.1", optional = true }
solana-client = { version = "2.1", optional = true }

[features]
default = []
solana = ["dep:solana-sdk", "dep:solana-client"]
production = ["solana"]

[dev-dependencies]
tokio = { version = "1.38", features = ["rt", "macros"] }
