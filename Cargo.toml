[package]
name = "pump_runner_bot"
version = "0.3.0"
edition = "2021"
description = "Production-ready Solana PumpSwap runner bot – Helius + Jupiter + Jito + Risk Management"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2.5"
base64 = "0.22"
bs58 = "0.5"
solana-sdk = "2.1"
solana-client = "2.1"
bincode = "1.3"
thiserror = "1.0"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
